<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shin-chan: Smooth Chaos Dash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #ffcc00;
        }

        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 65%, #90EE90 65%, #3CB371 100%);
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            pointer-events: none;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        h1 {
            color: #ffcc00;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #ff3366;
        }

        p {
            font-size: 16px;
            max-width: 85%;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #cc0033;
            transition: transform 0.1s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #cc0033;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div id="score">CHOCOBI: 0</div>
        <div id="status">STATUS: NORMAL</div>
    </div>
    <canvas id="gameCanvas" width="700" height="450"></canvas>
    
    <div id="overlay">
        <h1 id="title">SHIN-CHAN'S BUTT DASH</h1>
        <p id="description">
            🎒 Collect <b>Chocobi</b> & <b>Action Bastard Figures</b>!<br>
            🐶 <b>Shiro</b> runs around helping you fetch falling Chocobi!<br>
            ⚠️ <b>Dodge Misae!</b> Hit <b>100 Points</b> for the Buri Buri Dance Party!
        </p>
        <button class="btn" id="startBtn" onclick="startGame()">START GAME!</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('description');
const startBtn = document.getElementById('startBtn');

// Audio Synthesizer
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'chocobi') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'powerup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.15);
        osc.frequency.linearRampToValueAtTime(900, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'block') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'dance') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.setValueAtTime(700, now + 0.08);
        osc.frequency.setValueAtTime(400, now + 0.16);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    }
}

// Game Variables (SLOWER PACED)
let gameState = 'START';
let score = 0;
let nextDanceThreshold = 100;
let dancePartyTimer = 0;
let frameCount = 0;
let keys = {};

// Slower character speeds
const player = { x: 320, y: 330, width: 50, height: 60, speed: 5, direction: 1, isBuriBuri: false, buriBuriTimer: 0 };
const shiro = { x: 100, y: 355, width: 30, height: 25, speed: 2.8, direction: 1, targetX: 100 };

let items = [];
let enemies = [];
let floatingTexts = [];

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function startGame() {
    initAudio();
    gameState = 'PLAYING';
    score = 0;
    nextDanceThreshold = 100;
    dancePartyTimer = 0;
    items = [];
    enemies = [];
    floatingTexts = [];
    player.x = 320;
    player.isBuriBuri = false;
    player.buriBuriTimer = 0;
    overlay.style.display = 'none';
    scoreEl.innerText = `CHOCOBI: 0`;
    statusEl.innerText = `STATUS: NORMAL`;
}

function gameOver(reason) {
    gameState = 'GAMEOVER';
    overlay.style.display = 'flex';
    titleEl.innerText = "MISAE CAUGHT YOU!";
    descEl.innerHTML = `${reason}<br><br><b>Final Score:</b> ${score} Chocobi`;
    startBtn.innerText = "TRY AGAIN!";
}

function triggerDanceParty() {
    dancePartyTimer = 120;
    playSound('dance');
    addFloatingText("🎉 100 POINT BURI BURI PARTY! 🎉", canvas.width / 2 - 120, 180, "#ff007f");
}

function spawnItem() {
    items.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -40,
        speed: 1.2 + Math.random() * 0.8, // Slower item drop
        type: Math.random() < 0.15 ? 'ACTION_FIGURE' : 'CHOCOBI'
    });
}

function spawnEnemy() {
    enemies.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -50,
        size: 45,
        speed: 1.5 + Math.random() * 1.0 + (score * 0.01) // Slower enemy speed
    });
}

function addFloatingText(text, x, y, color = '#ffeb3b') {
    floatingTexts.push({ text, x, y, alpha: 1, color });
}

// Drawing Functions
function drawShinchan() {
    ctx.save();
    ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
    if (player.direction === -1) ctx.scale(-1, 1);

    if (player.isBuriBuri || dancePartyTimer > 0) {
        const wiggle = Math.sin(frameCount * 0.4) * 10;
        ctx.fillStyle = "#ffdbac";
        ctx.beginPath();
        ctx.arc(-10 + wiggle, -5, 16, 0, Math.PI * 2);
        ctx.arc(10 + wiggle, -5, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#d4a373"; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = "#ffdbac";
        ctx.fillRect(-15, 10, 10, 18);
        ctx.fillRect(5, 10, 10, 18);

        ctx.fillStyle = "#ff0000"; ctx.fillRect(-18, -28, 36, 18);
        ctx.fillStyle = "#ffdbac"; ctx.beginPath(); ctx.ellipse(0, -32, 14, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.fillRect(-8, -36, 6, 3); ctx.fillRect(2, -36, 6, 3);
    } else {
        const bounce = Math.abs(Math.sin(frameCount * 0.15)) * 4;
        ctx.fillStyle = "#ffdbac"; ctx.beginPath(); ctx.ellipse(0, -18 - bounce, 18, 15, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(-6, -24 - bounce, 7, 3, -0.2, 0, Math.PI * 2); ctx.ellipse(8, -24 - bounce, 7, 3, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-5, -18 - bounce, 3, 0, Math.PI * 2); ctx.arc(7, -18 - bounce, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff0000"; ctx.fillRect(-14, -3 - bounce, 28, 20);
        ctx.fillStyle = "#ffff00"; ctx.fillRect(-14, 17 - bounce, 28, 12);
        ctx.fillStyle = "#ffdbac"; ctx.fillRect(-10, 29 - bounce, 7, 10); ctx.fillRect(3, 29 - bounce, 7, 10);
    }
    ctx.restore();
}

function drawShiro() {
    ctx.save();
    ctx.translate(shiro.x + shiro.width / 2, shiro.y + shiro.height / 2);
    if (shiro.direction === -1) ctx.scale(-1, 1);

    const run = Math.sin(frameCount * 0.25) * 2;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0 + run, 14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -6 + run, 10, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(15, -12 + run, 4, 0, Math.PI * 2); ctx.fill(); 
    ctx.beginPath(); ctx.arc(16, -6 + run, 2, 0, Math.PI * 2); ctx.fill();  
    ctx.beginPath(); ctx.arc(20, -4 + run, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
}

function drawMisae(enemy) {
    ctx.save();
    ctx.translate(enemy.x, enemy.y);
    ctx.fillStyle = "rgba(255, 0, 0, 0.3)"; ctx.beginPath(); ctx.arc(0, 0, enemy.size / 2 + 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4a2e10"; ctx.beginPath(); ctx.arc(0, 0, enemy.size / 2 + 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffe0bd"; ctx.beginPath(); ctx.arc(0, 2, enemy.size / 2 - 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(-5, -2, 3, 0, Math.PI * 2); ctx.arc(5, -2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(-2, -3); ctx.moveTo(12, -8); ctx.lineTo(2, -3); ctx.stroke();
    ctx.restore();
}

function drawItem(item) {
    ctx.save();
    ctx.translate(item.x, item.y);
    if (item.type === 'CHOCOBI') {
        ctx.fillStyle = "#32cd32";
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            let a = (Math.PI / 3) * i;
            ctx.lineTo(14 * Math.cos(a), 14 * Math.sin(a));
        }
        ctx.closePath(); ctx.fill();
    } else {
        ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(0, -2, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#0000ff"; ctx.fillRect(-7, 4, 14, 12);
    }
    ctx.restore();
}

// Logic Updates
function update() {
    if (gameState !== 'PLAYING') return;
    frameCount++;

    if (dancePartyTimer > 0) {
        dancePartyTimer--;
        if (frameCount % 12 === 0) playSound('dance');
        return;
    }

    // Controls
    if (keys['ArrowLeft'] || keys['KeyA']) { player.x -= player.speed; player.direction = -1; }
    if (keys['ArrowRight'] || keys['KeyD']) { player.x += player.speed; player.direction = 1; }
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    if (player.isBuriBuri) {
        player.buriBuriTimer--;
        if (player.buriBuriTimer <= 0) {
            player.isBuriBuri = false;
            statusEl.innerText = `STATUS: NORMAL`;
            statusEl.style.color = `#ff3366`;
        }
    }

    // AI Shiro: Smoothly follows lowest Chocobi
    let closestItem = items.find(i => i.type === 'CHOCOBI');
    if (closestItem) {
        shiro.targetX = closestItem.x;
        if (shiro.x < shiro.targetX) { shiro.x += shiro.speed; shiro.direction = 1; }
        if (shiro.x > shiro.targetX) { shiro.x -= shiro.speed; shiro.direction = -1; }
    }

    // Spawning (Less frequent spawns)
    if (frameCount % 60 === 0) spawnItem();
    if (frameCount % 120 === 0) spawnEnemy();

    // Process Items
    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += it.speed;

        // Player Collects
        if (it.x > player.x && it.x < player.x + player.width && it.y > player.y && it.y < player.y + player.height) {
            if (it.type === 'CHOCOBI') {
                score += 10;
                playSound('chocobi');
                addFloatingText("+10 CHOCOBI!", it.x, it.y, "#76ff03");
            } else {
                score += 50;
                player.isBuriBuri = true;
                player.buriBuriTimer = 300;
                playSound('powerup');
                statusEl.innerText = `STATUS: 🍑 BURI BURI MODE! 🍑`;
                statusEl.style.color = `#ff007f`;
                addFloatingText("ACTION BASTARD!", player.x - 30, player.y - 20, "#ff007f");
            }
            items.splice(i, 1);
            checkScoreThresholds();
            continue;
        }

        // Shiro Collects
        if (Math.hypot(it.x - shiro.x, it.y - shiro.y) < 25) {
            score += 10;
            playSound('chocobi');
            addFloatingText("SHIRO GOT IT!", shiro.x, shiro.y - 10, "#00e5ff");
            items.splice(i, 1);
            checkScoreThresholds();
            continue;
        }

        if (it.y > canvas.height + 20) items.splice(i, 1);
    }

    // Process Enemies (Misae)
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;

        // Hit Player
        if (Math.hypot((player.x + player.width / 2) - en.x, (player.y + player.height / 2) - en.y) < en.size / 2 + player.width / 3) {
            if (player.isBuriBuri) {
                playSound('block');
                addFloatingText("BUTT BLAST!", en.x, en.y, "#ff0055");
                enemies.splice(i, 1);
                score += 20;
                checkScoreThresholds();
                continue;
            } else {
                gameOver("Misae caught Shin-chan!");
                return;
            }
        }

        if (en.y > canvas.height + 40) enemies.splice(i, 1);
    }

    // Floating Text
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1;
        ft.alpha -= 0.015;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }
}

function checkScoreThresholds() {
    scoreEl.innerText = `CHOCOBI: ${score}`;
    if (score >= nextDanceThreshold) {
        nextDanceThreshold += 100;
        triggerDanceParty();
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
    ctx.beginPath(); ctx.arc(120, 70, 30, 0, Math.PI * 2); ctx.arc(550, 60, 40, 0, Math.PI * 2); ctx.fill();

    items.forEach(drawItem);
    enemies.forEach(drawMisae);
    drawShiro();
    drawShinchan();

    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.font = "bold 18px 'Comic Sans MS', sans-serif";
        ctx.fillStyle = ft.color;
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
